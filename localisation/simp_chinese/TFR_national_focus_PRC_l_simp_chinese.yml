 new_focus_4: "化解地方债务"
 new_focus_4_desc: "地方政府积累的隐性债务如同一柄悬剑。中央将统筹规划，逐步化解存量风险，防范系统性金融隐患，为国家长远发展扫清障碍。"
 new_focus_5: "脱贫攻坚战"
 new_focus_5_desc: "贫穷不是社会主义。数千万最贫困人口的生活状况，一直是悬在我们心头的一块巨石。是时候发起一场前所未有的总攻了——我们将动员全党全国全社会的力量，通过精准识别、产业扶持、易地搬迁、生态补偿、教育医疗保障等系统性工程，‘扶上马，送一程’，确保在迈向现代化的道路上，不让任何一个地区、任何一个人掉队。这不仅是消除绝对贫困的壮举，更是实现社会公平、夯实国家治理根基的千年大计。"
 PRCN_NEW_FANGFANYUWEIR: "保健康，防重症"
 PRCN_NEW_FANGFANYUWEIR_desc: "PRCN_NEW_FANGFANYUWEIR_desc"
 new_focus_6: "打击网络水军"
 new_focus_6_desc: "网络空间已成为舆论主战场。必须坚决打击那些混淆视听、扰乱民心的网络水军，净化网络生态，维护国家意识形态安全与社会稳定。"
 new_focus_7: "重启大庆石油"
 new_focus_7_desc: "大庆油田曾是共和国工业的骄傲。如今，在石油危机阴影下，重启大庆生产，既是对历史荣光的致敬，也是保障国家能源安全的战略抉择。"
 new_focus_8: "重视新能源"
 new_focus_8_desc: "传统的化石能源时代终将落幕。重视太阳能、风能等新能源发展，不仅是应对石油危机的现实选择，更是引领未来绿色转型的战略远见"
 new_focus_9: "开展海上石油"
 new_focus_9_desc: "广阔的海洋蕴藏着丰富的资源。我们将加大海上油气勘探与开发力度，拓展能源供给新渠道，增强国家能源自主能力。"
 PRCN_KAICAIKUANGCHAN: "PRCN_KAICAIKUANGCHAN"
 PRCN_KAICAIKUANGCHAN_desc: "PRCN_KAICAIKUANGCHAN_desc"
 new_focus_10: "合成能源计划"
 new_focus_10_desc: "面对能源瓶颈，合成燃料技术为我们打开了新的大门。通过合成能源计划，中国将在能源领域实现关键突破，减少对外依赖，掌握未来发展的主动权。"
 new_focus_11: "调整航线"
 new_focus_11_desc: "中国，作为21世纪最具前景的新兴现代国家，之前所做的几大事件已然落幕。如今迈入2020年，我们将如何开启新的征程？在变幻莫测的国际局势中，是时候重新校准国家航向，迎接全新的挑战与机遇。"
 new_focus_12: "重视新能源"
 new_focus_12_desc: "传统的化石能源时代终将落幕。重视太阳能、风能等新能源发展，不仅是应对石油危机的现实选择，更是引领未来绿色转型的战略远见﻿"
 new_focus_13: "合成能源计划"
 new_focus_13_desc: "面对能源瓶颈，合成燃料技术为我们打开了新的大门。通过合成能源计划，中国将在能源领域实现关键突破，减少对外依赖，掌握未来发展的主动权。"
 new_focus_14: "打击网络水军"
 new_focus_14_desc: "网络空间已成为舆论主战场。必须坚决打击那些混淆视听、扰乱民心的网络水军，净化网络生态，维护国家意识形态安全与社会稳定。"
 new_focus_1: "保健康, 防重症"
 new_focus_1_desc: "疫情的阴影仍笼罩大地。我们走出了最艰难的阶段，但新冠病毒的威胁尚未完全消散。唯有加强防护、重视重症救治，方能彻底消除国家精神上的新冠疫情阴霾，让人民重拾信心与安宁。"
 # ===== 疫情线（革故鼎新）：按国策清单统一命名 =====
 # ===== 石油线（革故鼎新）：按国策清单统一命名 =====
 PRC_unite_with_reformists: "团结改革派"
 PRC_unite_with_the_left: "团结泛左派"
 PRC_unite_with_hardliners: "团结强硬/民族派"
 PRC_reconcile_both_sides: "调和两方矛盾"
 PRC_enact_the_anti_foreign_sanctions_law: "颁布反外国制裁法"
 PRC_promote_new_energy_vehicles: "推广新能源汽车"
 PRC_promote_home_quarantine: "宣传居家隔离"
 PRC_promote_home_quarantine_desc: "病毒仍在蔓延，而人们已经开始疲惫。与其一味动用强制手段，不如让每一个家庭都明白：留在家里，就是在为国家守住防线。我们将发动基层干部与社区网格员，把防疫要求送进每一栋楼、每一户人家，让居家隔离不再是一纸命令，而是人人自觉的选择。"
 new_focus_2: "调整房地产"
 new_focus_2_desc: "房地产市场长期积累的结构性矛盾已不容忽视。通过有限度的政策调整，我们在稳定住房市场的同时，缓解部分城市住房紧张的局面，为经济平稳运行筑牢基础"
 new_focus_3: "批判地方贪官"
 new_focus_3_desc: "面对疫情初期暴露出的种种问题，必须直面官僚体系的懈怠与失职。对相关官员的严肃批评，不仅是问责，更是重塑执政作风的起点。建制派影响力在此过程中进一步巩固，基层治理能力得到锤炼。"
 PRC_unite_with_reformists_desc: "党内改革声音日益高涨。面对疫情冲击后的经济下行与社会焦虑，部分同志主张进一步放开市场、扩大地方自主权、改善营商环境。我们必须主动团结这些力量，让他们看到党中央仍掌握方向。通过高层对话、政策吸纳与适度让步，将改革派纳入统一战线。只有把他们从潜在的离心力转化为推动力，才能在即将到来的更大挑战面前保持党的团结与稳定。历史证明，孤立改革者只会催生更大分裂；团结他们，则能让“中国特色社会主义”在新的历史阶段继续焕发生机。﻿"
 PRC_unite_with_the_left_desc: "新左翼力量在青年学生、基层干部与部分知识分子中迅速扩大影响。他们批评“资本无序扩张”，呼吁回归群众路线，强调公平与共同富裕。疫情暴露的社会鸿沟，让他们的主张更具共鸣。党中央必须主动接触、引导这些力量，避免其走向极端或被外部势力利用。通过理论研讨、政策试点与组织吸纳，将新左派的热情转化为巩固社会主义制度的积极因素。只有把他们团结在党的周围，才能防止左翼思潮失控，确保在复杂国际环境下，中国仍能高举红色旗帜前进。"
 PRC_unite_with_hardliners_desc: "台海局势日益紧张，党内强硬声音开始抬头。部分将领、情报系统与民族主义者主张彻底清算历史欠账，对外部干涉零容忍。他们的情绪反映了社会上对“百年屈辱”的集体记忆。我们必须正视并团结这些力量，而非简单压制。通过军事现代化宣传、历史教育强化与对台强硬表态，将复仇情绪引导为服务国家统一的动力。团结复仇派，不是鼓励冒险，而是确保在关键时刻，党能够调动最坚定的意志与最强大的执行力。"
 PRC_reconcile_both_sides_desc: "改革派要求进一步开放，新左派强调公平与管制，两者矛盾在地方层面已开始显现。若任其激化，将直接威胁党的权威。党中央必须出手调和：成立专项工作组，在中央层面统一政策口径；通过试点地区探索“既要活力又要公平”的路径；对过激言论进行纪律约束，同时给双方留出表达空间。调和不是和稀泥，而是在更高层次上重建共识——一切改革与调整，最终都服务于国家统一与民族复兴的总目标。只有两方矛盾被成功调和，党才能以完整姿态面对外部挑战。"
 PRC_enact_the_anti_foreign_sanctions_law_desc: "西方制裁名单不断加长，关键技术、金融与人员流动受到严重限制。为反制外部压力、保护本国利益，全国人大常委会通过《反国外制裁法》。该法赋予相关部门对等反制权力，对配合外国制裁的境内实体与个人可采取冻结资产、限制出入境等措施，并鼓励国内企业与机构主动规避制裁风险。这部法律不仅是法律武器，更是政治宣言：中国不会在主权与核心利益问题上退让。它将为后续军事与经济动员提供法律保障，也向世界表明——任何试图用制裁打断中国复兴进程的企图，都将付出相应代价。"
 PRC_promote_new_energy_vehicles_desc: "中东动荡引发全球油价暴涨，我国石油进口依存度过高的隐患彻底暴露。传统燃油车产业链面临巨大冲击，能源安全成为国家安全的重中之重。党中央果断决定，全面加速新能源汽车推广：扩大购置补贴、加快充电基础设施建设、强制公共领域车辆电动化、支持动力电池与智能驾驶关键技术攻关。同时对燃油车征收更高消费税，引导消费转型。这一政策不仅是应对短期危机的应急之举，更是推动产业升级、减少对外依赖、抢占未来出行制高点的战略布局。当石油不再成为我们的软肋时，中国才能真正掌握自己的命运。"
 PRC_one_time_missile_bombardment_desc: "为在开战初期最大限度瘫痪对方防御体系，火箭军将实施一次性大规模导弹打击。目标覆盖机场、港口、雷达站、指挥所与关键基础设施。打击强调精度与饱和度，力求在短时间内造成系统性瘫痪。这次轰炸将是战争的开场白，也是对对方意志的第一次重击。我们必须接受可能的国际舆论反弹，以及对方可能采取的报复手段。但军事逻辑很简单：如果不在第一波就把对方打残，后续登陆与地面作战的代价将成倍增加。一次性导弹轰炸，是为整个战役铺平道路的必要代价。"
 PRC_concessions_to_populist_demands_desc: "疫情与经济压力让普通百姓承受了巨大代价。抗议声音虽被迅速平息，但积怨并未消散。为维护社会稳定，我们必须做出实质性让步：扩大社会保障覆盖、提高最低工资标准、加快保障性住房建设、优化基层医疗与教育资源配置。同时通过舆论引导，让民众看到“党与人民站在一起”。这些让步并非软弱，而是为后续更大决策积累政治资本。只有民众感受到实际改善，才能在动员令下达时，真正做到“万众一心”。"
 PRC_shake_up_the_politburo_desc: "我们终于将举行中共第二十次全国代表大会，选出新一届中央委员会并确定下一个五年党的工作重心。无论国内外，许多人都对这次大会的结果相当关心。大会不仅意味着人事更替，也将决定党内哪一股政治力量在接下来的路线斗争中获得更大的影响。"
