 new_focus_3: "批判地方贪官"
 new_focus_3_desc: "面对疫情初期暴露出的种种问题，必须直面官僚体系的懈怠与失职。对相关官员的严肃批评，不仅是问责，更是重塑执政作风的起点。建制派影响力在此过程中进一步巩固，基层治理能力得到锤炼。"
 new_focus_4: "化解地方债务"
 new_focus_4_desc: "地方政府积累的隐性债务如同一柄悬剑。中央将统筹规划，逐步化解存量风险，防范系统性金融隐患，为国家长远发展扫清障碍。"
 new_focus_: "重提92共识"
 new_tw_focus_1: "对台发动经济战"
 new_tw_focus_1_desc: "台海局势日趋紧张，经济手段将成为重要武器。通过精准的经济施压，我们将削弱“台独”势力的经济基础，为最终解决台湾问题创造有利条件。"
 new_tw_focus_2: "重提92共识"
 new_tw_focus_2_desc: "92共识是两岸关系和平发展的共同政治基础。在当前形势下，重申这一共识，既是对历史的尊重，也是向岛内务实力量释放的善意信号。"
 new_tw_focus_3: "部署导弹"
 new_tw_focus_3_desc: "面对外部威胁与“台独”挑衅，中国人民解放军必须做好万全准备。导弹部队的战略部署，将构成坚不可摧的威慑力量，捍卫国家主权与领土完整。"
 new_tw_focus_4: "导弹打击"
 new_tw_focus_4_desc: "当和平手段无法奏效时，果断的军事行动将成为必要选项。对关键目标的精确导弹打击，将有力震慑“台独”分裂势力，展示维护国家统一的坚定决心。"
 new_tw_focus_5: "打倒台独分子"
 new_tw_focus_5_desc: "“台独”分裂势力是中华民族伟大复兴的最大障碍。彻底打倒台独分子，完成祖国统一大业，是全体中华儿女的历史使命与共同意志。"
 new_tw_focus_6: "告老还乡"
 new_tw_focus_6_desc: "最高领导层将以承担战败责任为由退出政治前台，为新的权力安排让出空间。一个时代以并不体面的方式结束了。"
 new_tw_focus_7: "建制派保持多数"
 new_tw_focus_7_desc: "尽管遭遇严重挫败，现有党政体系中的建制力量仍保持了组织与人事优势，并在新的权力安排中维持多数。"
 # ===== 台海战争树（革故鼎新）：按国策清单统一命名 =====
 PRC_mobilize_the_army: "动员军队"
 PRC_mobilize_the_army_desc: "美国陷入内战，外部干涉能力大幅削弱。历史给予我们的窗口期已经打开。中央军委下令启动全军动员：东部战区进入一级战备，火箭军与空军调整部署，两栖与空降部队开始集结。后备役人员分批召回，后勤与医疗系统全面转入战时轨道。动员令下达的同时，政治工作同步展开——让每一名官兵明白，这次行动不是冒险，而是完成祖国统一的历史使命。军队动员不仅是兵力集结，更是意志与纪律的全面检验。只有完成充分动员，我们才能在决战时刻以绝对优势压倒对手。"
 PRC_military_priority_production_policy: "颁发军工优先生产政策"
 PRC_military_priority_production_policy_desc: "一旦战端开启，弹药、导弹、舰艇与航空器材的消耗将远超和平时期想象。为确保前线不断供，国务院与中央军委联合颁发《军工生产优先政策》：所有相关企业必须优先保障国防订单，民用生产线可强制转产，关键原材料与能源优先分配给军工系统。同时设立战时生产调度中心，对产能进行统一调配。这项政策将短期内大幅提升军工产出，但也会对民用经济造成压力。我们必须接受这种代价——因为没有足够的钢铁与火药，统一大业就只能停留在口号层面。"
 PRC_taiwan_ultimatum: "最后通牒"
 PRC_taiwan_ultimatum_desc: "外交渠道已穷尽。台湾当局仍拒不承认“九二共识”，并试图在外部势力支持下继续抗拒统一。中国政府向台北发出最后通牒：在限定时间内宣布接受和平统一框架，否则解放军将采取一切必要措施。通牒内容通过新华社与国际媒体同步发布，既是对岛内民众的警告，也是对国际社会的宣示。最后通牒不是姿态，而是战争前的法律与政治程序。它将把选择权交到对方手中——投降或毁灭。无论对方如何回应，历史都将记录：统一的责任，已由我们尽到最后努力。"
 PRC_decapitate_the_roc_leadership: "斩首国府高层"
 PRC_decapitate_the_roc_leadership_desc: "为最大限度降低战争成本、缩短冲突时间，特种作战与情报系统制定“斩首”方案。目标锁定台湾当局核心决策层与关键军事指挥节点。通过精确导弹打击、特种部队渗透与网络攻击相结合，力求在开战初期瘫痪其指挥体系。斩首行动的风险极高，一旦失败可能激起更强烈抵抗；但若成功，将极大削弱对方组织防御的能力。我们必须在道德与军事效率之间做出选择。历史不会因为我们手软而给予额外机会。为了减少双方平民伤亡、尽快结束战争，斩首是必要的选项。"
 PRC_battle_of_taipei: "台北战役"
 PRC_battle_of_taipei_desc: "登陆部队在北部海岸取得立足点后，下一步就是直取台北。这座城市不仅是政治中心，更是对方意志的象征。战役计划强调多路并进、快速合围：空降部队夺取关键交通节点，装甲与机械化步兵从外围压缩，特种部队渗透市区清除指挥所。同时严格控制火力，尽量减少对民用设施的破坏，以利于战后接管。台北战役将是整场战争的高潮——拿下它，就等于拿下了统一的象征。我们必须以最小代价、最快速度完成这一目标，让世界看到解放军的现代化作战能力。"
 PRC_fierce_fighting_in_the_strait: "台海激战"
 PRC_fierce_fighting_in_the_strait_desc: "海峡已成为真正的战场。双方舰艇、飞机与导弹在狭窄海域激烈交锋。我方凭借数量优势与岸基火力支援，逐步压缩对方活动空间；对方则依托岛链与外部支援，试图拖长时间、等待国际干预。激战中，后勤补给线成为关键，电子战与反舰导弹的对抗决定胜负。这场海空大战不仅是军事较量，更是意志与体系的对决。我们必须保持进攻节奏，不给对方喘息机会。台海激战的每一天，都在消耗对方的抵抗意志；当我们把优势转化为决定性突破时，统一的大门就会真正打开。"
 PRC_liberate_ryukyu: "解放琉球"
 PRC_liberate_ryukyu_desc: "台海冲突升级后，日本介入的风险急剧上升。为消除侧翼威胁、切断对方潜在补给线，东部战区制定“解放琉球”方案。行动目标不是长期占领，而是临时控制关键岛屿、摧毁军事设施、警告日本不得进一步干涉。特种部队与两栖部队将实施快速突击，同时通过外交渠道声明行动的有限性。解放琉球将极大震撼日本国内舆论，也可能引发更大规模冲突。但这是我们必须承担的风险——如果不先发制人，对方就可能把琉球变成围堵中国的前进基地。历史不会原谅犹豫。"
 PRC_blockade_japan: "对日本执行封锁"
 PRC_blockade_japan_desc: "日本若继续向台湾提供实质性支持，就必须付出代价。中国海军与海警在相关海域实施选择性封锁，切断通往日本关键港口的战略物资运输，同时对日本船只实施登检与扣押。封锁行动将与外交抗议同步进行，向国际社会表明：任何干涉中国内政的行为，都将面临经济与军事双重压力。封锁不是全面战争，而是可控升级的手段。它将测试日本的承受力，也测试国际社会对中国决心的认知。当日本企业开始计算损失、民众开始质疑政府政策时，我们的战略目标就已部分达成。"
 PRC_one_time_missile_bombardment: "一次性导弹轰炸"
 PRC_one_time_missile_bombardment_desc: "为在开战初期最大限度瘫痪对方防御体系，火箭军将实施一次性大规模导弹打击。目标覆盖机场、港口、雷达站、指挥所与关键基础设施。打击强调精度与饱和度，力求在短时间内造成系统性瘫痪。这次轰炸将是战争的开场白，也是对对方意志的第一次重击。我们必须接受可能的国际舆论反弹，以及对方可能采取的报复手段。但军事逻辑很简单：如果不在第一波就把对方打残，后续登陆与地面作战的代价将成倍增加。一次性导弹轰炸，是为整个战役铺平道路的必要代价。"
 
