l_simp_chinese:
 market_socialism_PRC: "中国特色社会主义"
 market_socialism_PRC_desc: "\n\n\n\n£GFX_Ideology_Dengism\n\n\n\n\n\n§Y中国特色社会主义§!是科学社会主义理论逻辑与中国社会发展历史逻辑的辩证统一，是中国共产党领导中国人民开辟的实现中华民族伟大复兴的唯一正确道路。它坚持党的领导、人民当家作主、依法治国有机统一，坚持改革开放，解放和发展社会生产力。进入新时代，中国式现代化全面推进，共同富裕迈出坚实步伐，物质文明、政治文明、精神文明、社会文明、生态文明协调发展。中国坚定做世界和平的建设者、全球发展的贡献者、国际秩序的维护者。实践充分证明，只有中国特色社会主义才能发展中国、发展社会主义。"