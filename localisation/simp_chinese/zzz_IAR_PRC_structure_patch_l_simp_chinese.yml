 iar_prc_structure.1.t: "武汉出现不明原因肺炎"
 iar_prc_structure.1.d: "航线调整工作尚未结束，来自武汉的数份报告已经引起中央注意。一种原因未明、具有人际传播风险的肺炎正在出现，交通网络可能使局势迅速外溢。继续把它当作地方卫生问题处理已经不再稳妥。"
 iar_prc_structure.1.a: "立即召开紧急会议"
 PRC_analyze_social_problems: "分析社会问题"
 PRC_analyze_social_problems_desc: "战争造成的人员伤亡、经济冲击和社会失望正在相互叠加。只有弄清公众不满与政治信任流失的来源，后续的政治安排才可能重新建立最低限度的稳定。"
