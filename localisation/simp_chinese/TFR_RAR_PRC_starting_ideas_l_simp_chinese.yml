l_simp_chinese:
 IAR_PRC_promising_modern_state: "最有前景的现代国家"
 IAR_PRC_promising_modern_state_desc: "中国，作为21世纪最有前景的，最具有与美国、日本，欧洲三大帝国主义联盟竞争的潜力现代民族国家，中国正站在历史与现实的交汇点上。庞大的工业体系、完整的产业链、快速迭代的科技能力与超大规模的市场，共同构成了这个国家独特的发展底气。无论是新能源、数字经济，还是高端制造与基础设施建设，中国都在全球分工中占据越来越关键的位置。外部世界或许充满不确定性，但内部仍保持着对长期目标的坚定追求。这种“前景感”不仅来自物质力量的积累，更来自对自身道路的某种集体信心——它让这个国家在危机中仍能调动资源、凝聚意志，持续向更高水平的中国式现代化迈进。"
 IAR_PRC_public_security_stable: "社会治安稳定"
 IAR_PRC_public_security_stable_desc: "在绝大多数城市与乡村，日常秩序仍然清晰可感。90年代到千禧年的时候，命案率、严重暴力犯罪率长期处于较低水平，群众安全感连续多年维持在极高数值。从街巷巡逻到社区网格，从矛盾调解到应急响应，一套覆盖广泛的治安体系让普通人能够相对安心地生活与工作。这种稳定并非偶然，而是长期高压打击、源头治理与技术手段共同作用的结果。它成为社会运转的基础底色，也为其他领域的改革与发展提供了必要的外部条件。"
 IAR_PRC_crackdown_organized_crime: "扫黑除恶"
 IAR_PRC_crackdown_organized_crime_desc: "持续多年的扫黑除恶斗争已经从专项行动走向常态化。从传统的“村霸”“矿霸”“流氓”到新型的网络黑恶、套路贷与软暴力，执法力量保持高压态势，一批长期作恶的团伙被连根拔起。群众举报渠道被畅通，行业乱象被集中整治，“打伞破网”机制不断强化。虽然黑恶犯罪具有顽固性与变形能力，但整体社会治安环境因此得到明显净化，基层治理的土壤也因此得到一定程度的改善。这套机制成为维护秩序的重要工具，同时也在持续考验着法治化与规范化的水平。"
 IAR_PRC_gutian_restart: "从古田再出发"
 IAR_PRC_gutian_restart_desc: "古田不仅是历史坐标，更是精神起点。从1929年确立思想建党、政治建军的原则，到新时代再次强调政治整训与强军目标，人民军队始终被要求保持对党的绝对忠诚与鲜明的政治属性。这支军队被赋予的不只是打仗的功能，更是执行政治任务、服务人民的使命。每一次“再出发”都意味着对初心的回望与对现实问题的正视——校正方向、整顿作风、强化纪律，使军队在复杂环境中仍能保持较高的组织性与执行力。这种传统构成了军队建设的深层逻辑。"
 IAR_PRC_chinese_military: "中国军队"
 IAR_PRC_chinese_military_desc: "中国人民解放军是世界上规模最大的武装力量之一，拥有完整的军兵种体系与不断现代化的装备。党对军队的绝对领导被反复强调为“军魂”，政治工作被视为生命线。近年来，军队在编制体制、训练模式、装备升级与联合作战能力上持续推进改革，目标是建设世界一流军队。它既是国家安全的终极保障，也是国家意志在军事领域的集中体现。这支军队的存在本身，就对内外环境形成强大的战略威慑与稳定预期。"
 IAR_PRC_formalism: "形式主义"
 IAR_PRC_formalism_desc: "形式主义如同顽疾，反复出现又不断变异。会议层层召开、文件层层转发、台账越做越厚、痕迹越留越多，真正解决问题的时间却被不断挤压。一些干部官员重表态轻落实、重包装轻实效，热衷于“面子工程”与“政绩盆景”，对上负责有余、对下负责不足。数字化手段本应提升效率，却在某些地方变成新的负担——打卡、填表、转发、排名成为日常。这种作风不仅消耗基层精力，更侵蚀着政策落地的真实效果，成为治理体系中难以根除的隐性成本。"
 IAR_PRC_information_control: "言论管控"
 IAR_PRC_information_control_desc: "信息空间被高度结构化管理。敏感话题迅速消失，讨论边界时常模糊，自我审查成为许多人的本能反应。从传统媒体到社交媒体，从算法推荐到内容生成，一套严密的规则体系在运转。它在维护官方叙事与社会稳定方面发挥显著作用，却也压缩了公开辩论与多元表达的空间。一些真实的社会情绪与问题因此被压制或变形，长期来看可能影响信息流动的质量与决策反馈的准确性。管控本身成为系统运行的重要组成部分，也持续塑造着公共讨论的形态。"
 IAR_PRC_internet_disorder: "互联网乱象"
 IAR_PRC_internet_disorder_desc: "网络空间既是便利的工具，也是问题的温床。谣言、网络暴力、虚假营销、黑灰产业、情绪煽动与流量至上的逻辑交织在一起。短视频平台算法放大极端内容，个体焦虑与群体对立被轻易点燃。尽管监管部门不断开展专项整治，清理大量违规信息与账号，但新型乱象仍层出不穷。互联网本应连接人与信息，却在某些时刻加剧了撕裂与不信任。治理难度随技术迭代而上升，清朗空间的建设始终是一场没有终点的拉锯。"
 IAR_PRC_education_surplus: "学历过剩"
 IAR_PRC_education_surplus_desc: "高等教育规模持续扩张，毕业生数量屡创新高，但高质量岗位的增长速度未能同步匹配。本专科生、研究生甚至博士在就业市场上的竞争日趋激烈，文凭的信号作用逐渐减弱。许多年轻人陷入“学历内卷”——为了不掉队而继续升学，却发现出口依然拥挤。人才错配现象出现：高学历者从事低匹配度工作，技能型岗位却存在短缺。教育投入的个人与社会成本不断攀升，而预期回报却在下降，形成结构性焦虑的重要来源。"
 IAR_PRC_education_problems: "中国教育问题"
 IAR_PRC_education_problems_desc: "教育体系在规模与普及上取得巨大成就，却也积累了深层矛盾。应试导向依然强势，内卷从高等教育向低龄阶段蔓延；家庭焦虑推动超前学习与重复训练；职业教育认同度不足，人才供给与产业需求存在错位。学生负担沉重，创新与实践能力培养相对不足，心理健康问题日益凸显。教育本应促进人的全面发展与社会流动，却在某些环节异化为筛选与竞争的工具。如何在公平、质量与多元之间找到平衡，成为长期而艰难的课题。"
 IAR_PRC_low_economic_quality: "经济质量不高"
 IAR_PRC_low_economic_quality_desc: "经济总量巨大，但质量提升仍面临挑战。部分行业存在低水平重复建设与同质化竞争，资源配置效率有待提高；传统动能减弱与新动能培育之间存在过渡期阵痛；一些地方过度依赖投资与债务驱动，风险逐步累积。就业结构、收入分配与区域差距等问题交织，青年就业压力尤为突出。从“有没有”转向“好不好”的过程并非坦途，结构性改革需要时间与定力。经济运行的韧性犹在，但提质增效的任务依然沉重。"
