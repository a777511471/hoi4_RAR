l_simp_chinese:
 iar_prc_pandemic_opening.1.t: "又一个十年，新的开始"
 iar_prc_pandemic_opening.1.d: "从漠河到天涯海角，这片往日人头攒动竟的土地是如此寂静。很难想象，前一天还熙熙攘攘的街道，今日就只剩下一排排路灯低头照着没有脚步的地面，灯光模糊的洒在警戒居民的大字标语上。一切如断头浪一般突兀，也正暗流汹涌着。\n\n与空旷死寂的街道所不相称的，是楼宇中的一盏盏灯。有的窗户拉着厚实的窗帘，只漏出一丝光影，说明着里面尚有人生活。也有的窗户正映出白色或淡黄色，透过窗去，屋内不时有人走过，却常常是望一眼便又离开了。许久，街道上终于有人走来，他们身着从头罩到脚的白衣，一面慢慢的挪着步子，一面警惕的观察着有无旁人在户外活动。\n\n这次的瘟疫和以往一样，毫不费力地迫使人们按照病魔的节奏做出回应。人从街区、写字楼、工厂……各个地方赶回家里，被要求静静等待着，直到下一次命令的到来。一个个隔间，分割出一段段关于此次突发事件的纷纷议论。世事难料，上一刻大家还沉浸在周年狂欢的余温里，现在就已经被锁在以前难以常住的家中了。\n\n四下的安静，巧妙遮挡了一阵阵讨论，可在中南海那里，本应该总揽全局的习近平反常的沉默。平日里他的不断协调、决断，此时并未到来。李克强、蔡奇、王沪宁等人各种在自己的位置上木偶一样一动不动，心中却泛起思思不安，最终汇聚成这样一句。\n\n“上面请快发话吧，这是要做什么呢”\n\n然而能人依旧只是摆出思考的姿势，坐在那里满脸阴云。 能人得承认，他被眼前的突发事件别住了多少伟大规划，然而肩负重任的他怎能迟滞不前。迄今为止，他都以伟大复兴，万民拥戴的，毛泽东之后又一位领袖为目标。可如今要怎么做才能实现此番宏图伟业呢。\n\n渐渐的，他的思绪开始溢出……全是为了闹钟复兴大业，从12年的对内整肃，到15年的军改，再到18年力排众议的修改宪法，仅仅一个目标十年一日的努力终于在去年，取得了瞩目的成果。自己正站在那里中南海满意的打量着自己的创造的“奇迹”。现在是如何是好才能无限延续自己的辉煌呢……稳定与放纵化为抛出硬币，在不安的空气中弹起，不知何时落下。"
 iar_prc_pandemic_opening.1.a: "过去的继续，或是未来的开始……"
