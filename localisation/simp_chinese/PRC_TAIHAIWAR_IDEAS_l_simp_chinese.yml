  CHI_economic_blockade: "被彻底封锁的经济"
  CHI_economic_blockade_desc: "海空封锁切断了台湾与外界的贸易通道，资源枯竭、工厂停摆、物价飞涨。这座岛正被活活扼死。"

  CHI_impending_doom: "大难将临……"
  CHI_impending_doom_desc: "所有人都能感受到风暴正在逼近。士兵们在工事里焦躁不安，平民在囤积物资，空气中弥漫着末日的味道。要么守住，要么灭亡。"

